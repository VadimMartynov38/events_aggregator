services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      AGGREGATOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/events
      AGGREGATOR_PROVIDER_BASE_URL: https://events-provider.dev-2.python-labs.ru
      AGGREGATOR_PROVIDER_API_KEY: ${AGGREGATOR_PROVIDER_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: